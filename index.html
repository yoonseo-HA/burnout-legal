<style>
  :root{ --bg:#FBFAF8; --ink:#1F2328; --sub:#6B7078; --line:#E7E4DF; --card:#FFFFFF; --accent:#C1734D; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171A; --ink:#ECEDEE; --sub:#9BA1A8; --line:#262A2E; --card:#191D21; --accent:#D2865F; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",'Apple SD Gothic Neo',sans-serif}
  .wrap{max-width:520px;width:100%;padding:40px 24px;text-align:center}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}

  .tag{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;color:var(--sub);margin-bottom:36px}
  a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:20px 22px;margin:12px 0;text-align:left;transition:border-color .15s}
  a.card:hover{border-color:var(--accent)}
  a.card b{font-size:16px} a.card span{display:block;color:var(--sub);font-size:13.5px;margin-top:4px}
  .foot{margin-top:34px;color:var(--sub);font-size:12.5px}
  .foot a{color:var(--accent)}
</style>
</head>
